version: '3.8'

# 开发环境配置 - 支持热重载和调试

services:
  # GHX Server - 后端API服务 (开发模式)
  ghx-server:
    build:
      context: ..
      dockerfile: Dockerfile.ghx-server
    container_name: ghx-server-dev
    ports:
      - "${GHX_SERVER_PORT:-5000}:5000"
    volumes:
      # 挂载kubeconfig文件
      - ${KUBECONFIG_PATH:-~/.kube/config}:/root/.kube/config:ro
      # 挂载模板文件
      - ./job-template.yaml:/app/templates/job-template.yaml:ro
      - ./burnin-job-template.yaml:/app/templates/burnin-job-template.yaml:ro
      # 挂载GPU基准测试配置（JSON格式给后端使用）
      - ./gpu-benchmarks.json:/config/gpu-benchmarks.json:ro
      # 挂载源代码 (开发模式热重载)
      - ../ghx_server.py:/app/ghx_server.py:ro
      - ../backend_rate_limit.py:/app/backend_rate_limit.py:ro
      # 挂载共享存储目录
      - ghx-shared-data:/shared
      # 挂载日志目录
      - ghx-logs:/var/log
    environment:
      - KUBECONFIG=/root/.kube/config
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - K8S_NAMESPACE=${K8S_NAMESPACE:-gpu-health-expert}
      - GPU_RESOURCE_NAME=${GPU_RESOURCE_NAME:-nvidia.com/gpu}
      - RDMA_RESOURCES=${RDMA_RESOURCES:-rdma/hca_shared:1}
      - PYTHONUNBUFFERED=1
    networks:
      - ghx-network
    restart: unless-stopped
    command: ["python", "-m", "flask", "run", "--host=0.0.0.0", "--port=5000", "--debug"]

  # GHX Dashboard - 前端Web界面 (开发模式)
  ghx-dashboard:
    build:
      context: ../ghx-dashboard
      dockerfile: Dockerfile.ghx-dashboard
    container_name: ghx-dashboard-dev
    ports:
      - "${GHX_DASHBOARD_PORT:-3000}:3000"
    volumes:
      # 挂载源代码 (开发模式热重载)
      - ../ghx-dashboard:/app
      - /app/node_modules
      - /app/.next
      # 挂载GPU基准测试配置（JavaScript格式给前端使用）
      - ./gpu-benchmarks.js:/app/public/gpu-benchmarks.js:ro
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:${GHX_SERVER_PORT:-5000}
      - NEXT_PUBLIC_WS_URL=ws://localhost:${GHX_SERVER_PORT:-5000}
      - WATCHPACK_POLLING=true
    networks:
      - ghx-network
    restart: unless-stopped
    command: ["npm", "run", "dev"]

volumes:
  # 共享数据卷 - 用于存储GPU检查结果
  ghx-shared-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${SHARED_DATA_PATH:-./data/shared}
  
  # 日志数据卷
  ghx-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LOGS_PATH:-./data/logs}

networks:
  ghx-network:
    driver: bridge
