apiVersion: batch/v1
kind: Job
metadata:
  name: ghx-burnin-job-{JOB_ID}
  namespace: gpu-health-expert 
  labels:
    app: ghx-burnin
    job-type: burnin
    job-id: "{BASE_JOB_ID}"
    created-by: ghx-server
spec:
  parallelism: 1
  completions: 1
  ttlSecondsAfterFinished: 300  # Job完成后5分钟自动销毁
  backoffLimit: 0  # 禁止Job重试
  template:
    metadata:
      labels:
        app: ghx-burnin
        job-type: burnin
        job-id: "{BASE_JOB_ID}"
    spec:
      restartPolicy: Never
      tolerations:
      - operator: "Exists"
        effect: "NoSchedule"
      - operator: "Exists"
        effect: "PreferNoSchedule"
      - operator: "Exists"
        effect: "NoExecute"
      nodeSelector:
        kubernetes.io/hostname: "{NODE_NAME}"  # 直接指定前端选择的节点
      containers:
      - name: gpu-burnin
        image: kang2023/ghx-check:latest
        imagePullPolicy: IfNotPresent
        workingDir: /opt/gpu-burn
        command: ["python3"]
        args: ["/opt/gpu_burnin_monitor.py"]
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: JOB_ID
          value: "{JOB_ID}"
        - name: MEMORY_PARAM
          value: "{MEMORY_PARAM}"
        - name: DURATION
          value: "{DURATION}"
        - name: API_SERVER_URL
          value: "http://ghx-service.gpu-health-expert.svc.cluster.local:5000"
        resources:
          requests:
            {GPU_RESOURCE_NAME}: 8  # 8个GPU
          limits:
            {GPU_RESOURCE_NAME}: 8  # 8个GPU
        volumeMounts:
        - name: localtime
          mountPath: /etc/localtime
          readOnly: true
      volumes:
      - name: localtime
        hostPath:
          path: /etc/localtime
          type: File
