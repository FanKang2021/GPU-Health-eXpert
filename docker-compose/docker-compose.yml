version: '3.8'

services:
  # GHX Server - 后端API服务
  ghx-server:
    build:
      context: ..
      dockerfile: Dockerfile.ghx-server
    container_name: ghx-server
    network_mode: host
    volumes:
      # 挂载kubeconfig文件
      - ${KUBECONFIG_PATH:-~/.kube/config}:/root/.kube/config:ro
      # 挂载模板文件
      - ./job-template.yaml:/app/templates/job-template.yaml:ro
      - ./burnin-job-template.yaml:/app/templates/burnin-job-template.yaml:ro
      # 挂载GPU基准测试配置（JSON格式给后端使用）
      - ./gpu-benchmarks.json:/config/gpu-benchmarks.json:ro
      # 挂载共享存储目录
      - ghx-shared-data:/shared
      # 挂载日志目录
      - ghx-logs:/var/log
    environment:
      - KUBECONFIG=/root/.kube/config
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-0}
      - K8S_NAMESPACE=${K8S_NAMESPACE:-gpu-health-expert}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # GHX Dashboard - 前端Web界面
  ghx-dashboard:
    build:
      context: ../ghx-dashboard
      dockerfile: Dockerfile.ghx-dashboard
    container_name: ghx-dashboard
    network_mode: host
    volumes:
      # 挂载GPU基准测试配置（JavaScript格式给前端使用）
      - ./gpu-benchmarks.js:/app/public/gpu-benchmarks.js:ro
      # 动态生成env.js文件
      - ./env.js:/app/public/env.js:ro
    environment:
      - NODE_ENV=production
      - GHX_SERVER_PORT=${GHX_SERVER_PORT:-5000}
    restart: unless-stopped
    depends_on:
      - ghx-server
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  # 共享数据卷 - 用于存储GPU检查结果
  ghx-shared-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${SHARED_DATA_PATH:-./data/shared}
  
  # 日志数据卷
  ghx-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LOGS_PATH:-./data/logs}

# 使用host网络模式，不需要自定义网络
