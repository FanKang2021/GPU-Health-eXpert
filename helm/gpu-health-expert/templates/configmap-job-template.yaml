apiVersion: v1
kind: ConfigMap
metadata:
  name: job-template-config
  namespace: {{ .Release.Namespace }}
data:
  # 烧机测试Job模板
  burnin-job-template.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: ghx-burnin-job-{JOB_ID}
      namespace: {{ .Release.Namespace }}
      labels:
        app: ghx-burnin
        job-type: burnin
        job-id: "{BASE_JOB_ID}"
        created-by: ghx-server
    spec:
      parallelism: 1
      completions: 1
      ttlSecondsAfterFinished: 60  # Job完成后1分钟自动销毁
      backoffLimit: 0  # 禁止Job重试
      template:
        metadata:
          labels:
            app: ghx-burnin
            job-type: burnin
            job-id: "{BASE_JOB_ID}"
        spec:
          restartPolicy: Never
          tolerations:
          - operator: "Exists"
            effect: "NoSchedule"
          - operator: "Exists"
            effect: "PreferNoSchedule"
          - operator: "Exists"
            effect: "NoExecute"
          nodeSelector:
            kubernetes.io/hostname: "{NODE_NAME}"  # 直接指定前端选择的节点
                 containers:
                 - name: gpu-burnin
                   image: {{ .Values.cronjob.image }}
                   imagePullPolicy: IfNotPresent
                   workingDir: /opt/gpu-burn
                   command: ["python3"]
                   args: ["/opt/gpu_burnin_monitor.py"]
            env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: JOB_ID
              value: "{JOB_ID}"
            - name: MEMORY_PARAM
              value: "{MEMORY_PARAM}"
            - name: DURATION
              value: "{DURATION}"
            - name: API_SERVER_URL
              value: "{{ if .Values.apiServer.url }}{{ .Values.apiServer.url }}{{ else }}http://{{ .Values.apiServer.serviceName }}.{{ .Values.apiServer.namespace }}.svc.cluster.local:{{ .Values.apiServer.port }}{{ end }}"
            resources:
              requests:
                {GPU_RESOURCE_NAME}: 8  # 8个GPU
              limits:
                {GPU_RESOURCE_NAME}: 8  # 8个GPU
            volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
          volumes:
          - name: localtime
            hostPath:
              path: /etc/localtime
              type: File
  # 诊断测试Job模板
  job-template.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: ghx-manual-job-{JOB_ID}
      namespace: gpu-health-expert 
      labels:
        app: ghx-manual
        job-type: manual
        job-id: "{BASE_JOB_ID}"
        created-by: gpu-cli
    spec:
      parallelism: 1
      completions: 1
      ttlSecondsAfterFinished: 60  # Job完成后1分钟自动销毁
      backoffLimit: 0  # 禁止Job重试
      template:
        metadata:
          labels:
            app: ghx-manual
            job-type: manual
            job-id: "{BASE_JOB_ID}"
        spec:
          restartPolicy: Never
          tolerations:
          - operator: "Exists"
            effect: "NoSchedule"
          - operator: "Exists"
            effect: "PreferNoSchedule"
          - operator: "Exists"
            effect: "NoExecute"
          nodeSelector:
            kubernetes.io/hostname: "{NODE_NAME}"  # 直接指定前端选择的节点
          containers:
          - name: gpu-checker
            image: {{ .Values.cronjob.image }}
            imagePullPolicy: IfNotPresent
            command: ["python3"]
            args: ["/opt/gpu_check_job.py"]
            env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: JOB_TYPE
              value: "manual"
            - name: JOB_ID
              value: "{JOB_ID}"
            - name: ENABLED_TESTS
              value: "{ENABLED_TESTS}"
            - name: DCGM_DIAG_LEVEL
              value: "{DCGM_LEVEL}"
            - name: SELECTED_NODES
              value: "{SELECTED_NODES}"
            resources:
              requests:
                {GPU_RESOURCE_NAME}: 8
                {RDMA_RESOURCES}: 1
              limits:
                {GPU_RESOURCE_NAME}: 8
                {RDMA_RESOURCES}: 1
            securityContext:
              privileged: true
            volumeMounts:
            - name: shared-results
              mountPath: /shared
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: gpu-benchmarks-config
              mountPath: /config/gpu-benchmarks.json
              subPath: gpu-benchmarks.json
          volumes:
          - name: shared-results
            persistentVolumeClaim:
              claimName: ghx-pvc
          - name: localtime
            hostPath:
              path: /etc/localtime
              type: File
          - name: gpu-benchmarks-config
            configMap:
              name: gpu-benchmarks-config
